# GA crypto trading module — configuration.
# Product IDs and granularities follow Coinbase Advanced Trade's own format
# (e.g. "BTC-USDC", "ONE_HOUR") rather than generic "BTC/USDT" / "1h" strings.
# These are canonical across the codebase — BinanceAdapter translates them to
# "BTCUSDC" / "6h" on the wire, so the same config drives either exchange.

data:
  # coinbase | binance. Binance trades isolated margin: longs are sent with
  # sideEffectType NO_SIDE_EFFECT (nothing borrowed, so economically identical
  # to a Coinbase spot buy), shorts auto-borrow via MARGIN_BUY and cover with
  # AUTO_REPAY. Credentials come from ~/.coinbase/ or ~/.binance/ accordingly.
  exchange: "coinbase"
  # BTC over 2024-04 -> 2026-08 deliberately: both halves of the split contain
  # bull AND bear quarters (test half is 3 of each), unlike the previous
  # FET 2025-06 -> 2026-07 window whose test half held zero bull quarters and
  # so could only ever measure downside performance. BTC is also the most
  # balanced of the liquid pairs over this span (+13% total, ~50% up-days), so
  # neither direction is free money — FET returned -94% here and would simply
  # teach the GA to stay short. Other pairs are for validating a shortlist,
  # not for sweeping.
  pair: "BTC-USDC"
  granularity: "SIX_HOUR"   # ONE_MINUTE | FIVE_MINUTE | FIFTEEN_MINUTE | THIRTY_MINUTE | ONE_HOUR | TWO_HOUR | SIX_HOUR | ONE_DAY
  start_date: "2024-04-01"
  end_date: "2026-08-25"
  test_split: 0.5        # fraction of the window held out for testing

market_data:
  # directory where fetched candle windows are cached to disk, keyed by
  # (pair, granularity, start, end) — repeat fetches of the same window
  # (e.g. across a parameter sweep) read from here instead of Coinbase.
  # Optional — defaults to ~/.coinbase/ga/candle_cache (shared across every
  # worktree of this checkout). Uncomment to override:
  # cache_dir: "./candle_cache"
  # Columns min-max normalized into norm_<column> before scoring/training.
  # Only these are weightable — strategy.weight_keys must be a subset, checked
  # at startup. The deltas moved here from delta_columns below so the GA can
  # actually weight them; see the note on weight_keys for what that measured.
  normalized_columns: ["rsi", "macd", "macd_histogram", "delta_1", "delta_3", "delta_5", "delta_10"]
  # Normalized but NOT weightable. Empty now that the deltas are weighted —
  # kept as the seam for adding a column to the frame before deciding whether
  # the model should score on it.
  delta_columns: []

  # Wider-market context. `index_pairs` is an equal-weight basket standing in
  # for "the market"; with it set, every frame gains an `index_z` column — the
  # pair's return minus the basket's, scored against its own recent spread. So
  # +2 means this pair is diverging from the market by more than it normally
  # does, and 0 means it is simply going along with it.
  #
  # Equal weight, not volume weight: this is meant to be the menu a strategy
  # picked from, so every item on it gets the same say.
  #
  # OFF by default, and that matters — turning it on changes the frame every
  # genome is scored on. To use it, set the basket, add "index_z" to BOTH
  # normalized_columns and strategy.weight_keys, and retrain. Genomes saved
  # before it existed carry no such weight and are run with it at zero.
  # index_pairs: ["BTC-USDT", "ETH-USDT", "SOL-USDT", "XRP-USDT", "DOGE-USDT"]
  # index_period: 30      # candles of spread history the z-score is scaled by

# Paper trading — `python -m coinbase.ga.paper_trading` runs ONE tick and exits,
# so it can be driven by Windows Task Scheduler instead of a process left open.
# It acts on the last CLOSED candle and refuses to act on the same candle twice,
# so scheduling it more often than the granularity is safe and costs nothing:
# every 30 minutes against SIX_HOUR candles means 11 of 12 runs are no-ops.
# That avoids aligning a local-time schedule to UTC boundaries across DST, and
# a machine asleep at the boundary acts late rather than skipping the candle.
#
# The ledger is simulated and seeded from strategy.starting_balance below.
# Nothing here places an order or reads a real account balance.
paper:
  # The market to follow, which need NOT be the one the genome was trained on.
  # Trained on Coinbase BTC-USDC; papered against the venue actually intended
  # for execution.
  exchange: "binance"
  pair: "BTC-USDT"
  # Balance and open position persist here between ticks, so a reboot does not
  # silently reset the book to flat. Optional — defaults to
  # ~/.coinbase/ga/paper_state.json. Delete the file to start the run over.
  # state_filepath: "./paper_state.json"

strategy:
  # How hard the GA is penalised for an uncertain trade sample.
  #
  # Fitness scores the one-sided 95% Student-t LOWER BOUND on the per-trade
  # edge, not the realized total. Scoring the realized total meant annualizing
  # whatever happened: a genome that took two lucky trades in eleven months was
  # graded as if that pace and that luck ran all year, and the search learned to
  # trade almost never and hope. Measured on 60 runs with signed weights, 23 of
  # them scored on a single never-closed position and 8 cleared 100% annualized
  # on a median of three trades.
  #
  # 1.0 applies the bound in full. 0.0 restores the historical behaviour, which
  # is how a pre-existing run is reproduced. The REPORTED annualized_yield is
  # untouched either way, so experiments/index.csv stays comparable across every
  # run ever recorded.
  # Which model design turns a candle into a signal_score — the FUNCTION, as
  # opposed to the thresholds below, which are the policy acting on its output.
  #
  # "linear" is the weighted sum every run so far was trained under: one weight
  # per weight_key, L1-normalized, summed against the norm_* columns. It is the
  # only design this build has, and it is named rather than assumed so that a
  # saved strategy.json records what produced it — a genome is otherwise just a
  # bag of numbers, and a loader would score it through whatever design happened
  # to be configured.
  #
  # Adding a design is therefore additive: an existing genome keeps its own, and
  # two designs can be papered side by side as separate algos in paper.yaml.
  #
  # "dual" is the second design: an ENTRY model scored while flat and an EXIT
  # model scored while holding, each with its own L1 budget. It exists because
  # linear shares one budget between both jobs while only the exit half can use
  # position_pnl, so weight spent on exits lowers the ceiling the entry score
  # must clear — a live genome topped out at 0.5196 against a buy_threshold of
  # 0.60 and could only ever short. Set strategy.exit_keys alongside it.
  #
  # It removes that failure completely, and this is not an argument but a count.
  # Over 70 runs on the same window, measured entry-side ceilings:
  #
  #                 min      mean     max     runs that can never open a long
  #   linear      0.3875    0.7538   0.9571   6 of 70
  #   dual        1.0000    1.0000   1.0000   0 of 70
  #
  # WHAT IT COSTS depends entirely on how big the exit model is, and finding
  # that out took two wrong turns worth recording.
  #
  # With a three-column exit model it looked expensive. Twenty pairs at
  # SIX_HOUR, three seeds, costs charged:
  #
  #                 yield    trades   gross    fees    max_dd
  #   linear       +16.1%      8.0    1672      92      0.348
  #   dual 3-col    +3.2%     29.6     617     341      0.481
  #
  # Mean difference -12.9pp, better on 8 of 20 pairs, paired t(19) = -1.335 —
  # not significant, but consistently negative, and THIRTY_MINUTE agreed in
  # direction (+27.9% against +12.6%, worse on both pairs).
  #
  # Dual traded roughly four times as often, which looked like a calibration
  # artefact: a separately normalized exit score spans the full [0, 1] where
  # linear's is squeezed by whatever the entry columns take, so the exit
  # thresholds would be crossed far more readily. THAT EXPLANATION IS WRONG,
  # and widening the hold band is what disproved it. 20 pairs, 3 seeds:
  #
  #   exit model   hold band    trades   gross     yield    vs linear
  #   3 columns    0.40/0.45      29.6    +617     +3.2%   -12.9pp  (t -1.34)
  #   3 columns    0.25/0.60      17.4     -52     -3.3%   -19.4pp  (t -2.66)
  #   3 columns    0.15/0.75       3.0   -1251    -13.8%   -29.9pp  (t -3.09)
  #
  # Widening did cut trading, from 29.6 round trips to 3.0 — below linear's 8.0.
  # Yield fell monotonically with it, and the two widened arms are the only ones
  # that clear the significance bar, in the wrong direction. Holding longer is
  # simply worse here. Do not widen the band to "fix" dual.
  #
  # WHAT DOES CLOSE THE GAP IS A SMALLER EXIT MODEL. With exit_keys empty the
  # exit model is a single weight on position_pnl — a learned trailing stop —
  # and the genome carries 8 weights, EXACTLY linear's count:
  #
  #   exit model   hold band    trades   gross     yield    vs linear
  #   pnl only     0.40/0.45      38.3   +1274     +8.5%    -7.5pp  (t -0.66)
  #   linear                       8.0   +1672    +16.1%         —
  #
  # Indistinguishable from linear, 10 of 20 pairs better — a coin flip. Since
  # both genomes carry the same 8 weights over the same columns, the remaining
  # gap cannot be dimensionality: it is the grouping alone, and it is not
  # measurable at this sample size.
  #
  # Note the ordering that rules out "dual trades too much" altogether: the
  # pnl-only arm trades MORE than the 3-column one (38.3 against 29.6) and earns
  # twice the gross. Frequency was never the problem. The exit model's three
  # extra columns were making exits worse.
  #
  # ADOPTED, with exit_keys EMPTY. The guarantee is worth a cost that cannot be
  # distinguished from zero, and the alternative was a guard that DETECTS a
  # broken genome after training rather than a model that cannot produce one.
  #
  # Every genome records its own design and exit_keys, so nothing already
  # trained changes meaning: a linear genome stays linear and is still scored
  # through LinearSignal. Only new training is affected, and it must be
  # RETRAINED to be papered — a linear genome's weights say nothing about what
  # an entry model alone should hold.
  design: "dual"
  # Empty on purpose: the exit model is then a single weight on position_pnl, a
  # learned trailing stop, and the genome carries the same 8 weights linear did.
  # Adding columns here measured WORSE — three of them took the gap against
  # linear from -7.5pp (indistinguishable) to -12.9pp while HALVING gross
  # profit, and they made exits worse rather than more frequent.
  exit_keys: []
  fitness_confidence: 1.0
  # A post-only limit resting on the opposite side from entry, placed the
  # moment a position opens: a fraction ABOVE entry for a long, below it for a
  # short. 0.0 leaves every fill at a candle close, which is what every run
  # recorded so far was scored under.
  #
  # It exists because a position that spikes intraday and closes flat books the
  # close. It is also a maker order, so it earns the spread rather than crossing
  # it — which on this account is all resting one earns, since the measured
  # maker and taker rates are identical.
  #
  # Two things it cannot claim. Touching a level is not filling at it: the order
  # sits behind whatever is already resting there and OHLC cannot say whether
  # the queue cleared, so every result is an UPPER bound. And OHLC has no
  # chronology, so Backtest checks liquidation BEFORE this — a candle reaching
  # both takes the loss, because assuming otherwise invents money.
  #
  # OPTIMISE IT AS A SWEEP AXIS, not by reading test results. Measured across
  # 60 trained genomes, tight targets actively hurt (1% cut gross by 22% and
  # sent trades from 7 to 46, capping winners while losers ran) and wide ones
  # helped (12% added 22%). But the best level ranged from 0% to beyond 20%
  # depending on the pair, so a single figure is the wrong shape — scale it by
  # the pair's own volatility, or sweep it per pair.
  #
  # RE-MEASURED ON THE STATIONARY SEVEN, and 0.0 is the best level on both
  # pairs tested. THIRTY_MINUTE, three seeds, costs charged:
  #
  #                    BTC-USDT              ETH-USDT
  #   target      yield  trades   win     yield  trades   win    BTC drawdown
  #   0.00       +20.3%     5.3   50%    +36.4%    13.3   68%          0.18
  #   0.01       +23.1%    58.7   95%    +20.7%    53.3   94%          0.22
  #   0.02        -0.8%    38.7   88%    +19.8%    23.7   92%          0.21
  #   0.04        -3.4%    67.7   59%    +32.5%    16.7   94%          0.21
  #
  # The +24.4% that a 1% target scored under the old five weight_keys is still
  # there (+23.1%), but the BASELINE moved underneath it: 0.0 went from +5.0%
  # to +20.3% when the level columns left. The gap the target was credited
  # with, +19.4pp, is now +2.8pp on BTC and NEGATIVE on ETH, where 0.0 beats
  # every target and mean max_drawdown rises from 0.34 to 0.79 at 1%.
  #
  # DISTRUST ANY NON-ZERO ARM UNTIL THE SEED SPREAD IS CHECKED. At 0.08 on
  # BTC all three seeds hold genuinely different weight vectors and produce an
  # IDENTICAL book — 7 trades, gross 3208.64, yield sd 0.000. Same at 0.08 and
  # 0.16 on ETH. There the exit rule is the whole strategy and the genome is
  # inert, so the number says nothing about a trained model. The 95% win rates
  # above are the related tell: `unwind_at_entry_price` books a still-open
  # loser at its own entry price, so a target that exits winners early and
  # leaves losers running carries its losses off the books entirely, and there
  # is no stop loss on the other side.
  #
  # Re-measure with sweep_take_profit_{btc,eth}_30m.yaml, and re-measure again
  # if weight_keys changes — this knob's apparent value was a property of the
  # feature set both times it has been read.
  take_profit_pct: 0.0
  position_size_pct: 0.60  # fraction of quote-currency balance risked per trade
  buy_threshold: 0.60       # signal_score above this opens a position
  sell_threshold: 0.40      # signal_score below this closes an open position
  starting_balance: 10000.0  # quote-currency balance at the start of a backtest
  # A backtest force-closes any still-open position at the end of the window so
  # every run produces a final profit figure. When true, that forced close is
  # priced at the position's own entry price (net-zero profit — the position is
  # simply still "in flight", not judged a win or a loss) instead of at the
  # window's last market price, so a strategy isn't penalized or credited just
  # for where the training/test window happened to cut off mid-hold.
  unwind_at_entry_price: true
  # Shorting is modelled as a 1x isolated margin account: a position's notional
  # is capped at the quote balance (position_size_pct <= 1.0) and is backed by
  # exactly that much margin, so a short is liquidated if price doubles against
  # it. Coinbase Advanced Trade has no short side — this is a Binance-style
  # margin model, and only the backtest simulates it today.
  allow_short: true
  short_entry_threshold: 0.25  # signal_score below this opens a short
  # 0.45 rather than 0.50 on the evidence of sweep 1c: +10.9% mean vs +3.4% at
  # 0.50, seed sd 3.9%, all five seeds positive, Welch t=3.25. The only
  # calibration result so far whose effect clearly exceeds its seed noise.
  # Above 0.50 it degrades sharply and a -9.5%/2-trade failure mode recurs.
  short_exit_threshold: 0.45   # signal_score above this covers an open short
  # Trading costs. Both default to 0.0, and every run recorded before these
  # existed was scored at 0.0 — so raising them makes new runs incomparable
  # with the old ones on annualized_yield. The index records both rates per
  # run for exactly that reason: group by them before comparing.
  #
  # fee_bps is charged per leg on the notional that changed hands (entry AND
  # exit, including a liquidation and the end-of-window unwind). Binance spot/
  # margin taker is 10.0 at VIP0; Coinbase Advanced Trade taker starts at 60.0
  # and falls with volume.
  fee_bps: 0.0
  # borrow_bps_per_hour accrues only against an open SHORT, on the base it
  # borrowed marked at entry. A long borrows nothing on either venue
  # (sideEffectType NO_SIDE_EFFECT), so it never accrues. Binance publishes
  # this as a daily rate per asset — divide by 24. This is the cost the GA was
  # blindest to: a short held for days scored identically to one held an hour.
  borrow_bps_per_hour: 0.0
  indicators:
    sma_short_period: 9
    sma_long_period: 20
    sma_extra_period: 50
    rsi_period: 14
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
  # Which normalized columns the GA assigns a weight to and scores on.
  #
  # STATIONARY COLUMNS ONLY, as of the two-pair sweep in
  # sweep_features_30m.yaml / sweep_features_eth_30m.yaml. The three moving
  # averages that used to be here are LEVELS — essentially the price path —
  # with a lag-1 autocorrelation of 1.0000 over the training half, and a model
  # fitted on a level learns where price WAS, which is the one thing that does
  # not transfer. Measured at THIRTY_MINUTE with costs charged:
  #
  #            annualized yield        BTC-USDT   ETH-USDT
  #   these 7 keys                       +20.3%     +36.4%
  #   the old 5 (three of them levels)    +8.1%     -20.4%
  #
  # Every seed was positive on both pairs, and the worst seed of the new set
  # beat the mean of the old one on both. The GA had already been saying so:
  # given the old five, all three seeds drove the three SMA weights to zero.
  #
  # Weights may go negative only when genetic_algorithm.allow_negative_weights
  # is on; signal_score then lifts its floor back to zero so these thresholds
  # keep their calibration either way.
  weight_keys: ["rsi", "macd", "macd_histogram", "delta_1", "delta_3", "delta_5", "delta_10"]

genetic_algorithm:
  # Whether a weight may be NEGATIVE, i.e. whether the model can express an
  # inverse relationship ("RSI high -> sell") at all. With it off, a genome can
  # only ever learn "RSI high -> buy harder", which excludes every
  # mean-reverting reading of an indicator.
  #
  # Off by default: every genome trained so far has non-negative weights, and
  # this changes what the search can EXPRESS, not merely where it looks. When
  # on, weights are L1-normalized (absolute values sum to 1) and signal_score
  # shifts its floor back to zero, so a signed genome is not penalised by
  # thresholds calibrated for a [0, 1] score. Both are exact no-ops for a
  # genome whose weights are all non-negative.
  #
  # LEAVE IT OFF, and do not be persuaded otherwise by the older runs in
  # experiments/index.csv. Measured twice, on the same twenty pairs and window:
  #
  #                                       off        on     paired
  #   old five keys (three of them levels)   -10.4%   +28.9%   16/20 pairs
  #   the stationary seven, at SIX_HOUR      +16.1%   +13.0%    9/20 pairs
  #
  # The +39pp the flag appears to be worth in the index is not the flag. It is
  # the flag compensating for the three price-level columns that used to be
  # scored. A model that can only read a LEVEL and can only add to its score is
  # genuinely crippled, and signed weights rescued it; with the levels gone the
  # constraint costs nothing. Note which arm moved: dropping the levels took
  # the OFF arm from -10.4% to +16.1%, while the ON arm barely changed.
  #
  # At THIRTY_MINUTE it is not neutral but harmful: -26.6pp, worse in all ten
  # matched (pair, seed) cells, Welch t = -4.61 over twenty runs, and median
  # max_drawdown rising from 0.19 to 0.44. Costs charged in every arm.
  #
  # Re-measure with sweep_signed_weights_{6h,30m}_{off,on}.yaml before changing
  # this line — and re-measure it again if weight_keys changes, because that is
  # exactly the dependency that made the first reading wrong.
  # allow_negative_weights: true
  population_size: 100
  generations: 50
  mutation_rate: 0.2        # per-gene probability of mutation
  crossover_rate: 0.8       # probability a child comes from crossover rather than a cloned parent
  tournament_size: 5
  elitism_count: 1
  mutation_sigma: 0.2       # stddev of Gaussian noise added to a mutated weight
  seed: 1                # set an int for reproducible runs (e.g. in tests)

output:
  # Every path below is optional and defaults to a fixed location under
  # ~/.coinbase/ga/ — outside the repo, so every git worktree of this checkout
  # shares one results/cache location instead of each accumulating its own.
  # Uncomment any of these to override:
  # strategy_filepath: "./best_strategy.json"
  # log_filepath: "./ga_run_log.txt"
  # dry_run_log_filepath: "./dry_run_log.txt"
  # every run's resolved config + strategy + GA log, kept under its own run_id
  # subdirectory — full history, never overwritten (unlike strategy_filepath above).
  # experiments_dir: "./experiments"
  # one CSV row per run (pair, hyperparameters, performance) appended here —
  # a leaderboard for comparing runs without opening each one's strategy.json.
  # index_filepath: "./experiments/index.csv"
