# GA crypto trading module — configuration.
# Product IDs and granularities follow Coinbase Advanced Trade's own format
# (e.g. "BTC-USDC", "ONE_HOUR") rather than generic "BTC/USDT" / "1h" strings,
# since CoinbaseAdapter is called directly with these values.

data:
  pair: "FET-USDC"
  granularity: "TWO_HOUR"   # ONE_MINUTE | FIVE_MINUTE | FIFTEEN_MINUTE | THIRTY_MINUTE | ONE_HOUR | TWO_HOUR | SIX_HOUR | ONE_DAY
  start_date: "2025-06-01"
  end_date: "2026-07-01"
  test_split: 0.5        # fraction of the window held out for testing

market_data:
  # directory where fetched candle windows are cached to disk, keyed by
  # (pair, granularity, start, end) — repeat fetches of the same window
  # (e.g. across a parameter sweep) read from here instead of Coinbase.
  # Optional — defaults to ~/.coinbase/ga/candle_cache (shared across every
  # worktree of this checkout). Uncomment to override:
  # cache_dir: "./candle_cache"
  # columns min-max normalized into norm_<column> before scoring/training.
  normalized_columns: ["sma_short", "sma_long", "sma_extra", "rsi", "macd"]
  delta_columns: ["delta_1", "delta_3", "delta_5", "delta_10"]

strategy:
  position_size_pct: 0.60  # fraction of quote-currency balance risked per trade
  buy_threshold: 0.60       # signal_score above this opens a position
  sell_threshold: 0.40      # signal_score below this closes an open position
  starting_balance: 10000.0  # quote-currency balance at the start of a backtest
  # A backtest force-closes any still-open position at the end of the window so
  # every run produces a final profit figure. When true, that forced close is
  # priced at the position's own entry price (net-zero profit — the position is
  # simply still "in flight", not judged a win or a loss) instead of at the
  # window's last market price, so a strategy isn't penalized or credited just
  # for where the training/test window happened to cut off mid-hold.
  unwind_at_entry_price: true
  indicators:
    sma_short_period: 9
    sma_long_period: 20
    sma_extra_period: 50
    rsi_period: 14
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
  # which normalized columns the GA assigns a weight to and scores on. Deliberately
  # excludes market_data.delta_columns, which get normalized but not weighted.
  weight_keys: ["sma_short", "sma_long", "sma_extra", "rsi", "macd"]

genetic_algorithm:
  population_size: 100
  generations: 50
  mutation_rate: 0.2        # per-gene probability of mutation
  crossover_rate: 0.8       # probability a child comes from crossover rather than a cloned parent
  tournament_size: 5
  elitism_count: 1
  mutation_sigma: 0.2       # stddev of Gaussian noise added to a mutated weight
  seed: 1                # set an int for reproducible runs (e.g. in tests)

output:
  # Every path below is optional and defaults to a fixed location under
  # ~/.coinbase/ga/ — outside the repo, so every git worktree of this checkout
  # shares one results/cache location instead of each accumulating its own.
  # Uncomment any of these to override:
  # strategy_filepath: "./best_strategy.json"
  # log_filepath: "./ga_run_log.txt"
  # dry_run_log_filepath: "./dry_run_log.txt"
  # every run's resolved config + strategy + GA log, kept under its own run_id
  # subdirectory — full history, never overwritten (unlike strategy_filepath above).
  # experiments_dir: "./experiments"
  # one CSV row per run (pair, hyperparameters, performance) appended here —
  # a leaderboard for comparing runs without opening each one's strategy.json.
  # index_filepath: "./experiments/index.csv"
