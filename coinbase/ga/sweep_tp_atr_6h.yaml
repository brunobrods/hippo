# Does a take-profit target priced in the pair's OWN volatility pay?
#
# A fixed take_profit_pct has now been measured twice and retired twice, and
# both failures were a level in the wrong place for the pair it was applied to.
# Below a pair's own reachable move the target fires on nearly every hold and
# the genome goes inert — three different weight vectors returned an IDENTICAL
# book at 0.08 on BTC. Above it, the target never fires. The MFE sweep fixed
# that by computing each pair's percentiles BY HAND, which is not something a
# config can carry to a pair nobody has measured.
#
# take_profit_atr_mult carries it. The target rests at k x the entry candle's
# atr_pct, so one k lands at the same place in every pair's distribution.
#
# ── Where the arms come from ──────────────────────────────────────────
#
# Measured on the 437 trades the LINEAR control took across these same twenty
# pairs, as the reachable move divided by the entry candle's atr_pct:
#
#   percentile of reachable move    k      trades that would reach it
#             p10                 0.58              91.3%
#             p25                 1.87              73.7%  (k=2)
#             p50                 4.16              51.0%  (k=4)
#             p75                 8.00              25.2%  (k=8)
#             p90                14.72              16.0%
#
# So 2, 4 and 8 sit on that distribution's quartiles, and each arm fires on a
# known and different share of holds. Median entry atr_pct is 3.75%, so these
# are roughly 7.5%, 15% and 30% targets — and the SAME arm is a 4.9% target on
# the quietest pair and a 9.3% one on the wildest, which is the entire point.
#
# 0.0 is the control: no resting order, every fill at a close.
#
# ── What would make this another dead knob ────────────────────────────
#
# READ THE SEED SPREAD AND THE TRADE COUNT FIRST, in that order. If an arm's
# seeds return identical books the genome is inert and the exit rule is the
# whole strategy — that result says nothing about a trained model, and it is
# how the +24.4% that started this whole line of work got believed.
#
# Then read CAPTURED SHARE before yield. Every take-profit arm ever measured
# raised capture (23.6% to 52-70%) without moving yield, because keeping more
# of fewer trades is a wash; yield carries one observation per run and six
# trades per run cannot separate anything. If capture rises and yield does not,
# that is the same wash again and the knob is worth nothing — say so and retire
# it rather than sweeping a fourth level.
#
# Note what unwind_at_entry_price does to any target: a still-open loser is
# booked at its own entry price, so a target that takes winners early while
# losers keep running carries its losses off the books entirely. Win rate is
# not a defence here, and there is still no stop loss on the other side.
#
#   python -m coinbase.ga.sweep coinbase/ga/sweep_tp_atr_6h.yaml --workers 6
#
# 240 points (4 arms x 20 pairs x 3 seeds): ~50 min across 6 workers.

base_config: "coinbase/ga/config.yaml"

fixed:
  strategy.design: "linear"
  # The control and every arm share these, so the only thing that moves between
  # points is the target.
  strategy.take_profit_pct: 0.0

  data.exchange: "binance"
  data.granularity: "SIX_HOUR"
  data.start_date: "2024-04-01"
  data.end_date: "2026-02-28"

  strategy.fee_bps: 10.0
  strategy.borrow_bps_per_hour: 0.042
  genetic_algorithm.allow_negative_weights: false

seeds: [1, 2, 3]

axes:
  # THE LINE UNDER TEST. 0.0 is no resting order at all.
  - path: "strategy.take_profit_atr_mult"
    values: [0.0, 2.0, 4.0, 8.0]
  - path: "data.pair"
    values:
      - "AAVE-USDT"
      - "ADA-USDT"
      - "AVAX-USDT"
      - "BICO-USDT"
      - "DASH-USDT"
      - "DEXE-USDT"
      - "DOGE-USDT"
      - "ETH-USDT"
      - "FET-USDT"
      - "LINK-USDT"
      - "NEAR-USDT"
      - "ONG-USDT"
      - "PROM-USDT"
      - "SOL-USDT"
      - "SUI-USDT"
      - "UNI-USDT"
      - "WLD-USDT"
      - "XLM-USDT"
      - "XRP-USDT"
      - "ZEC-USDT"
