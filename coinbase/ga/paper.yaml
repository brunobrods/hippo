# Multi-pair paper trading. Each algo drives one trained genome against one
# pair on one venue, ticking when that pair's own candle closes.
#
#   python -m coinbase.ga.paper_engine
#   python -m coinbase.ga.paper_engine --once
#
# Kept separate from config.yaml deliberately: that file describes a TRAINING
# run (one pair, one window, one set of GA hyperparameters), while this one
# describes what is being papered right now. Each algo's genome carries its own
# thresholds, so they never need to agree with config.yaml's strategy section.

# Supplies what is shared across algos and is a property of the frame rather
# than the strategy: indicator periods, normalized/delta columns, weight_keys.
ga_config: "coinbase/ga/config.yaml"

engine:
  granularity: "THIRTY_MINUTE"
  # Wait this long past the boundary before fetching — a candle is not
  # queryable the instant it closes.
  boundary_offset_seconds: 20
  # Mark-to-market poll. Decisions still only happen on the boundary; this only
  # keeps unrealized PnL on the dashboard live in between. One request per
  # venue, whatever the pair count.
  price_refresh_seconds: 45
  # Shared across every candle fetch on one venue, so N algos cannot multiply
  # the bound that keeps requests inside their timeout.
  max_concurrent_requests: 8
  # Binance's measured taker rate for this account (/sapi/v1/asset/tradeFee,
  # 2026-09-05: maker 10, taker 10). Correct for every algo below because they
  # all execute on Binance. This is engine-wide — AlgoConfig carries no fee of
  # its own, unlike granularity — so adding a Coinbase algo would charge it 10
  # where this account really pays 40 taker, flattering it fourfold. Move the
  # fee onto AlgoConfig before mixing venues again.
  fee_bps: 10.0
  # Hourly borrow cost, charged only against an open SHORT on the base it
  # borrowed. Binance publishes a daily rate per asset — divide by 24. ETH
  # isolated read 0.00005864/day on 2026-09-05, so 0.5864 bps/day ÷ 24. Also
  # engine-wide: a short of any other base is priced at ETH's rate.
  borrow_bps_per_hour: 0.0244
  # Both default under ~/.coinbase/ga/paper/ — outside the repo, so every
  # worktree shares one set of books instead of each keeping its own.
  # state_dir: null
  # log_dir: null

dashboard:
  host: "127.0.0.1"
  port: 8787

# Merged under every algo below; an algo's own key wins.
defaults:
  # Every algo executes on Binance now, which is what makes engine.fee_bps of
  # 10 the right number for all of them. An algo pointed back at Coinbase would
  # be charged a quarter of what this account really pays there.
  exchange: "binance"
  starting_balance: 10000.0

# Point strategy_filepath at a run's own experiments/<run_id>/strategy.json
# rather than best_strategy.json — the latter is overwritten by every training
# run, so a papered algo would silently swap strategy mid-flight.
algos:
  # Was "btc" on Coinbase BTC-USDC. Renamed rather than repointed: the state
  # file is keyed on the algo name and PaperStateFile.read() ignores the `pair`
  # it stores, so keeping the name would have loaded a USDC position entered at
  # 79929.90 and marked it against USDT prices without complaint. The old
  # btc.json is left on disk as the record of that book.
  - name: "btc-binance"
    exchange: "binance"
    pair: "BTC-USDT"
    strategy_filepath: "~/.coinbase/ga/experiments/20260905T093423388865Z-e741e033/strategy.json"
  # Was "eth", on a genome that COULD NOT OPEN A LONG. Its weights put 0.4804
  # on position_pnl, which scores zero while flat, leaving a top reachable
  # score of 0.5196 against a buy_threshold of 0.60 — so in its entire live
  # history it could only ever short. TwoSidedModel now refuses such a genome
  # at load; this replaces it.
  #
  # Renamed rather than repointed, following btc-binance above: the state file
  # is keyed on the algo name, and the old book's one realized trade belongs to
  # the old strategy. Keeping the name would have credited this genome with
  # another genome's history. eth.json stays on disk as that book's record.
  #
  # Trained on Binance ETH-USDT so it is papered against the same pair and
  # venue — its thresholds were tuned against this book. Seed 5 of the
  # signed-weights sweep's 30-minute control arm: the stationary seven,
  # non-negative weights, costs charged, +47.8% test yield over 14 trades with
  # a flat ceiling of 0.6717. Four of that arm's five seeds clear the
  # threshold and one does not, so this is a real selection, not a formality.
  #
  # It is also the best of five on the half it was selected over, which makes
  # it an upper bound rather than an expectation — the same in-sample selection
  # BestRunPerPair carries, and worth remembering when this book is read.
  - name: "eth-2sided"
    exchange: "binance"
    pair: "ETH-USDT"
    strategy_filepath: "~/.coinbase/ga/experiments/20260911T180738731565Z-b04580d2/strategy.json"
  # - name: "sol-binance"
  #   exchange: "binance"
  #   pair: "SOL-USDT"
  #   starting_balance: 5000.0
  #   strategy_filepath: "~/.coinbase/ga/experiments/<run_id>/strategy.json"
